name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compiles and packages the app. Tests are skipped here because they need
      # a live database/API key that CI doesn't have.
      - name: Build
        run: mvn -B -DskipTests package
